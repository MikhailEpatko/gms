[extend]
useDefault = true

[[rules]]
id = "url-credentials"
description = "Пароль в URL"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@'"`]+:([^\s/]+@[\p{L}\p{N}._-]+)'''
secretGroup = 1
keywords = ["://"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = [
	'''^(?i:pass|password|пароль|redacted)@[^@]*$''',
	'''^<[^<>\s]+>@[^@]*$''',
	'''^\$[A-Z_][A-Z0-9_]*@[^@]*$''',
	'''^\$\{[A-Za-z_][A-Za-z0-9_]*\}@[^@]*$''',
]

[[rules.allowlists]]
regexTarget = "match"
regexes = ['''@(?:[\p{L}\p{N}_-]+\.)*(?i:example\.(?:com|org))\.?$''']

[[rules]]
id = "gitlab-tree-url"
description = "URL ветки GitLab с настоящим хостом"
regex = '''(?i:https?)://((?:[^\s/'"`]*@)?[^\s/:@'"`]+(?::\d+)?(?:/[^\s/'"`]+)*)/-/tree/'''
secretGroup = 1
keywords = ["/-/tree/"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?:[^/]*@)?(?:(?i:gitlab|gitlab\.com)|<[^<>\s/]+>|(?:[\p{L}\p{N}_-]+\.)*(?i:example\.(?:com|org)))(?::\d+)?(?:/|$)''']
