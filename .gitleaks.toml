# Правила gitleaks для pre-commit hook из .githooks: правила по умолчанию, свои правила этого репозитория
# дописываются ниже. Репозиторий публичный: корпоративные домены и настоящие хосты сюда не пишутся.
#
# Заглушки хоста в своих правилах общие: <…>, example.com и example.org с поддоменами, а в URL ветки ещё gitlab
# и gitlab.com. gitleaks склеивает регулярки одного allowlist через |, поэтому флаг регистра ставится только
# на группу (?i:…): (?i) в начале одной регулярки сделал бы регистронезависимыми все.

[extend]
useDefault = true

# Учётные данные в URL: схема://логин:пароль@хост. Секрет — пароль вместе с хостом, чтобы в выводе hook не было
# видно ни того ни другого. Пароль идёт до последнего @ перед хостом и может содержать @, : и кавычки. Хост —
# только буквы, цифры, «.», «-» и «_», чтобы скобки, кавычки и разметка Markdown после URL в него не попадали.
[[rules]]
id = "url-credentials"
description = "Пароль в URL"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@'"`]+:([^\s/]+@[\p{L}\p{N}._-]+)'''
secretGroup = 1
keywords = ["://"]

# Заглушка: пароль целиком равен pass, password, пароль, маске gitleaks REDACTED, <…>, переменной окружения
# ($ИМЯ заглавными) или подстановке ${имя}. За заглушкой идёт последний @ и хост. Не stopwords: они ищут подстроку.
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
	'''^(?i:pass|password|пароль|redacted)@[^@]*$''',
	'''^<[^<>\s]+>@[^@]*$''',
	'''^\$[A-Z_][A-Z0-9_]*@[^@]*$''',
	'''^\$\{[A-Za-z_][A-Za-z0-9_]*\}@[^@]*$''',
]

# Домен-пример, без учёта регистра и с точкой конца предложения: совпадение кончается на хосте, порт в него
# не входит.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''@(?:[\p{L}\p{N}_-]+\.)*(?i:example\.(?:com|org))\.?$''']

# URL ветки окружения в формате конфига gms: http(s)://[логин@]хост[:порт]/…/-/tree/…. Секрет — всё между ://
# и /-/tree/ (логин, хост, порт, путь к репозиторию), так что в выводе hook остаётся https://REDACTED/-/tree/….
# Ловится любой хост, кроме заглушек; IPv6-литералы и хосты, которые пропускает глобальный allowlist gitleaks
# (содержат false, начинаются с true, кончаются на null), не ловятся.
[[rules]]
id = "gitlab-tree-url"
description = "URL ветки GitLab с настоящим хостом"
regex = '''(?i:https?)://((?:[^\s/'"`]*@)?[^\s/:@'"`]+(?::\d+)?(?:/[^\s/'"`]+)*)/-/tree/'''
secretGroup = 1
keywords = ["/-/tree/"]

# Заглушка: хост целиком равен gitlab, gitlab.com, <…> или домену-примеру; за ним идёт порт, путь или конец.
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?:[^/]*@)?(?:(?i:gitlab|gitlab\.com)|<[^<>\s/]+>|(?:[\p{L}\p{N}_-]+\.)*(?i:example\.(?:com|org)))(?::\d+)?(?:/|$)''']
