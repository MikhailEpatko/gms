name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: установка gitleaks, nocomments и golangci-lint
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/MikhailEpatko/nocomments@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: sh scripts/check.sh

  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: установка gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --config .gitleaks.toml --redact -v .
